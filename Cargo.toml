[workspace]
members = ["crates/kaelis-core", "crates/kaelis-api", "crates/kaelis-gui", "crates/kaelis-launcher"]
resolver = "2"

[workspace.package]
# One version for every crate: the launcher, tray tooltip, updater comparison,
# and About card must never disagree about which build is running.
version = "0.4.4"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
description = "Kaelis — a native Rust Minecraft launcher"
homepage = "https://github.com/fuvji/kaelis"
repository = "https://github.com/fuvji/kaelis"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
