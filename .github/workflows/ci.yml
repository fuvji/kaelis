name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is pinned to the supported Intel image: the arm64 pool is
        # capacity-constrained, and macos-14 is being retired this month.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libxdo is linked by the GUI's input crate on Linux; without it the
          # test binaries fail to link before any test runs.
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p kaelis-launcher

      # Build the actual installable artifact on every push, so a broken
      # AppImage, .deb, or DMG fails CI instead of a tag.
      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: ./packaging/linux/package.sh --no-build

      - name: Smoke test Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --info dist/Kaelis-linux-x64.deb >/dev/null
          mkdir -p "$RUNNER_TEMP/appimage-smoke"
          cd "$RUNNER_TEMP/appimage-smoke"
          "$GITHUB_WORKSPACE/dist/Kaelis-linux-x64.AppImage" --appimage-extract >/dev/null
          ./squashfs-root/AppRun --version --json

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          ./packaging/macos/bundle.sh
          ./packaging/macos/dmg.sh
          hdiutil verify dist/Kaelis-macos-universal.dmg

      - name: Headless smoke test
        shell: bash
        run: |
          BIN=target/release/kaelis
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" --version --json
          KAELIS_DATA_DIR="$RUNNER_TEMP/kaelis-ci" "$BIN" --status --json
          KAELIS_DATA_DIR="$RUNNER_TEMP/kaelis-ci" "$BIN" --list-instances --json
          KAELIS_DATA_DIR="$RUNNER_TEMP/kaelis-ci" "$BIN" --accounts --json
          KAELIS_DATA_DIR="$RUNNER_TEMP/kaelis-ci" "$BIN" --use-account Builder --json
          KAELIS_DATA_DIR="$RUNNER_TEMP/kaelis-ci" "$BIN" --accounts --json

  site:
    name: Site assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every relative href/src on the page must resolve inside site/: a 404 on
      # the download or checksum link is a release bug, not a cosmetic one.
      - name: Check local links resolve
        run: |
          set -euo pipefail
          missing=0
          while read -r path; do
            if [[ "$path" == http* || "$path" == mailto* ]]; then
              continue
            fi
            # EXE/ZIP/Setup are release assets served by the Pages hydrator,
            # not tracked build output. Their presence is checked below.
            case "$path" in
              downloads/*.exe|downloads/*.zip|downloads/*.deb|downloads/*.AppImage|downloads/*.dmg|downloads/*.tar.gz) continue ;;
            esac
            target="site/${path%%#*}"
            if [[ ! -e "$target" ]]; then
              echo "missing: $path"
              missing=1
            fi
          done < <(grep -oE '(href|src)="[^"#][^"]*"' site/index.html \
                     | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          exit "$missing"

      - name: Check release download references
        run: |
          set -euo pipefail
          for artifact in Kaelis.exe Kaelis-Portable.zip Kaelis-Setup.exe \
                          Kaelis-macos-universal.dmg Kaelis-linux-x64.deb \
                          Kaelis-linux-x64.AppImage Kaelis-linux-x64.tar.gz; do
            grep -q "downloads/$artifact" site/index.html || {
              echo "page does not link $artifact"
              exit 1
            }
          done

      - name: Check checksums when artifacts are present
        run: |
          if [[ -f site/downloads/Kaelis.exe ]]; then
            cd site/downloads && sha256sum -c SHA256SUMS.txt
          else
            echo "build artifacts are release assets; the Pages deploy verifies them"
          fi

      - name: Validate JSON and XML
        run: |
          set -euo pipefail
          python3 -c "import json,sys; json.load(open('site/manifest.webmanifest'))"
          python3 -c "import xml.dom.minidom as m; m.parse('site/sitemap.xml')"

      - name: Check manifest icons exist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          manifest = json.load(open("site/manifest.webmanifest"))
          for icon in manifest.get("icons", []) + manifest.get("screenshots", []):
              path = os.path.join("site", icon["src"])
              if not os.path.exists(path):
                  raise SystemExit(f"manifest references a missing file: {path}")
          PY
