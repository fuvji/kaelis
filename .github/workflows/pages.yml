name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/hydrate-site.ps1"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The page is always deployed from main, which is what CI checked.
          # Downloads come from the release named by the event, so a release
          # deploy still serves that release's artifacts on the current page.
          ref: main

      - name: Fetch release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          tag="${{ github.event.release.tag_name }}"
          pattern_args=(
            --pattern Kaelis.exe
            --pattern Kaelis-Portable.zip
            --pattern Kaelis-Setup.exe
            --pattern Kaelis-macos-universal.zip
            --pattern Kaelis-macos-universal.dmg
            --pattern Kaelis-linux-x64.tar.gz
            --pattern Kaelis-linux-x64.deb
            --pattern Kaelis-linux-x64.AppImage
            --pattern SHA256SUMS.txt
            --pattern KAELIS-LINKS.txt
          )
          if [ -n "$tag" ]; then
            gh release download "$tag" --dir site/downloads --clobber "${pattern_args[@]}"
          else
            gh release download --dir site/downloads --clobber "${pattern_args[@]}"
          fi

      - name: Refresh download sizes and hashes
        run: pwsh -NoProfile -File tools/hydrate-site.ps1

      - name: Keep the deployed artifact to the page
        run: |
          set -euo pipefail
          # Downloads are served from the GitHub release, not from Pages. The
          # fetch above exists only so the hydrator can hash real artifacts;
          # shipping ~100 MB of binaries made every Pages deploy slow.
          find site/downloads -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name 'KAELIS-LINKS.txt' \
            ! -name 'README.md' \
            ! -name 'LICENSE' -delete

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
