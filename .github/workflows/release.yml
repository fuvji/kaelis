name: Release

# Tag a commit (`git tag v0.1.2 && git push --tags`) and every platform is built
# from that exact source. The site links point at these artifacts, so a tag is
# the only way a download can change.
on:
  push:
    tags: ["v*"]
  # Manual runs still build every platform and keep the artifacts; only a tag
  # publishes them, so a stray dispatch cannot move a download link.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build and package
        shell: pwsh
        run: ./tools/release.ps1 -Toolchain stable-x86_64-pc-windows-msvc

      - name: Checksums
        shell: bash
        run: |
          cd site/downloads
          sha256sum Kaelis.exe Kaelis-Portable.zip Kaelis-Setup.exe > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            site/downloads/Kaelis.exe
            site/downloads/Kaelis-Portable.zip
            site/downloads/Kaelis-Setup.exe
            site/downloads/KAELIS-LINKS.txt
            site/downloads/SHA256SUMS-windows.txt

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Bundle
        run: ./packaging/macos/bundle.sh --universal

      - name: Package
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Kaelis.app dist/Kaelis-macos-universal.zip
          cd dist
          shasum -a 256 Kaelis-macos-universal.zip > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          if-no-files-found: error
          path: |
            dist/Kaelis-macos-universal.zip
            dist/SHA256SUMS-macos.txt

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Window libraries
        run: |
          sudo apt-get update
          # The GUI links libxdo through its input crate on Linux.
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p kaelis-launcher

      - name: Package
        run: |
          set -euo pipefail
          stage="dist/kaelis-linux-x64"
          rm -rf "$stage" && mkdir -p "$stage"
          install -m 755 target/release/kaelis "$stage/kaelis"
          install -m 644 packaging/linux/kaelis.desktop "$stage/kaelis.desktop"
          install -m 644 site/assets/kaelis-mark.svg "$stage/kaelis.svg"
          install -m 644 LICENSE "$stage/LICENSE"
          install -m 644 site/downloads/README.md "$stage/README.md"
          tar -C dist -czf dist/Kaelis-linux-x64.tar.gz kaelis-linux-x64
          cd dist
          sha256sum Kaelis-linux-x64.tar.gz > SHA256SUMS-linux.txt

      - name: Smoke test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/Kaelis-linux-x64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/kaelis-linux-x64/kaelis" --version --json
          KAELIS_DATA_DIR="$RUNNER_TEMP/kaelis-smoke" \
            "$RUNNER_TEMP/kaelis-linux-x64/kaelis" --status --json

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            dist/Kaelis-linux-x64.tar.gz
            dist/SHA256SUMS-linux.txt

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          # One file covering every platform, sorted for a stable diff.
          cat SHA256SUMS-windows.txt SHA256SUMS-macos.txt SHA256SUMS-linux.txt \
            | grep -v '^#' | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-windows.txt SHA256SUMS-macos.txt SHA256SUMS-linux.txt
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          name: Kaelis ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
