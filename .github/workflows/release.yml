name: Release

# Tag a commit (`git tag v0.2.2 && git push --tags`) and every platform is built
# from that exact source. The site links point at these artifacts, so a tag is
# the only way a download can change.
on:
  push:
    tags: ["v*"]
  # Manual runs still build every platform and keep the artifacts; only a tag
  # publishes them, so a stray dispatch cannot move a download link.
  workflow_dispatch:

permissions:
  contents: write
  # Publishing dispatches the site deploy, which needs workflow permissions.
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build and package
        shell: pwsh
        run: ./tools/release.ps1 -Toolchain stable-x86_64-pc-windows-msvc

      - name: Checksums
        shell: bash
        run: |
          cd site/downloads
          sha256sum Kaelis.exe Kaelis-Portable.zip Kaelis-Setup.exe > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            site/downloads/Kaelis.exe
            site/downloads/Kaelis-Portable.zip
            site/downloads/Kaelis-Setup.exe
            site/downloads/KAELIS-LINKS.txt
            site/downloads/SHA256SUMS-windows.txt

  macos:
    name: macOS universal
    # Pin the image: `macos-latest` sat queued for half an hour twice and was
    # cancelled before a runner picked it up. macos-14 is the current stable
    # arm64 image and still cross-builds the Intel half of the universal app.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Bundle
        run: ./packaging/macos/bundle.sh --universal

      - name: Package
        run: |
          set -euo pipefail
          ./packaging/macos/dmg.sh
          ditto -c -k --keepParent dist/Kaelis.app dist/Kaelis-macos-universal.zip
          cd dist
          shasum -a 256 Kaelis-macos-universal.zip Kaelis-macos-universal.dmg > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          if-no-files-found: error
          path: |
            dist/Kaelis-macos-universal.zip
            dist/Kaelis-macos-universal.dmg
            dist/SHA256SUMS-macos.txt

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Window libraries
        run: |
          sudo apt-get update
          # The GUI links libxdo through its input crate on Linux.
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p kaelis-launcher

      - name: Package
        run: ./packaging/linux/package.sh --no-build

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum Kaelis-linux-x64.tar.gz Kaelis-linux-x64.deb Kaelis-linux-x64.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Smoke test every packaged form
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf dist/Kaelis-linux-x64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/kaelis-linux-x64/kaelis" --version --json
          KAELIS_DATA_DIR="$RUNNER_TEMP/kaelis-smoke" \
            "$RUNNER_TEMP/kaelis-linux-x64/kaelis" --status --json
          dpkg-deb --info dist/Kaelis-linux-x64.deb >/dev/null
          mkdir -p "$RUNNER_TEMP/appimage-smoke"
          cd "$RUNNER_TEMP/appimage-smoke"
          "$GITHUB_WORKSPACE/dist/Kaelis-linux-x64.AppImage" --appimage-extract >/dev/null
          ./squashfs-root/AppRun --version --json

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            dist/Kaelis-linux-x64.tar.gz
            dist/Kaelis-linux-x64.deb
            dist/Kaelis-linux-x64.AppImage
            dist/SHA256SUMS-linux.txt

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          # One file covering every platform, sorted for a stable diff.
          cat SHA256SUMS-windows.txt SHA256SUMS-macos.txt SHA256SUMS-linux.txt \
            | grep -v '^#' | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-windows.txt SHA256SUMS-macos.txt SHA256SUMS-linux.txt
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          name: Kaelis ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

      # A release created with the workflow token does not raise a `release`
      # event for other workflows, so the site is dispatched explicitly; without
      # this the page ships the previous release's binaries.
      - name: Deploy the site with the new downloads
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so `gh` has no repository to infer from.
          GH_REPO: ${{ github.repository }}
        # `main`, not the tag: the Pages environment only admits the default
        # branch, and the page copy lives on main while the downloads step pulls
        # the newest release, which is the one just published.
        run: gh workflow run pages.yml --ref main
