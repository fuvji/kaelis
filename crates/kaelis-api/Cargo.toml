[package]
name = "kaelis-api"
version = "0.2.5"
edition.workspace = true
description = "Kaelis API: Mojang versions, Modrinth, CurseForge, auth, and launch"
homepage = "https://github.com/fuvji/kaelis"
repository = "https://github.com/fuvji/kaelis"

[dependencies]
kaelis-core = { path = "../kaelis-core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
sha1 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = "2"
url = "2"
md-5 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# The shared content store asks the filesystem how many links name a file, so a
# cache entry that no instance references can be pruned safely.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # OpenProcess + SetPriorityClass steer background game instances.
    "Win32_System_Threading",
    # GetForegroundWindow tells the governor which game owns the screen.
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
