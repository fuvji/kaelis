[package]
name = "kaelis-launcher"
version = "0.4.0"
edition.workspace = true
description = "Kaelis — native Rust Minecraft launcher"
homepage = "https://github.com/fuvji/kaelis"
repository = "https://github.com/fuvji/kaelis"

[[bin]]
name = "kaelis"
path = "src/main.rs"

[dependencies]
kaelis-core = { path = "../kaelis-core" }
kaelis-api = { path = "../kaelis-api" }
kaelis-gui = { path = "../kaelis-gui" }
eframe = { version = "0.28", features = ["default_fonts", "glow", "wgpu"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    # The build being replaced is waited on by handle, not by polling for it.
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
