[package]
name = "kaelis-gui"
version = "0.1.0"
edition.workspace = true
description = "Kaelis desktop interface: content studio, instances, and accounts"
homepage = "https://github.com/epufk/kaelis"
repository = "https://github.com/epufk/kaelis"

[dependencies]
kaelis-core = { path = "../kaelis-core" }
kaelis-api = { path = "../kaelis-api" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
eframe = { version = "0.28", features = ["default_fonts", "glow"] }
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
qrcode = "0.14"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
